name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build product catalogue
        run: node scripts/build-worker-products.js

      # The catalogue is rebuilt again via preCommands, inside the action's own
      # context. Without this, wrangler shipped the *committed* worker.js and
      # ignored the step above — so CMS-only commits deployed green and left the
      # chatbot serving a stale catalogue (frozen 25 Aug – 3 Sep 2026).
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b6bc2dfe06ac5c3ce5d1223777e1be41
          preCommands: |
            node scripts/build-worker-products.js
            node -e "const s=require('fs').readFileSync('worker.js','utf8');const a=s.indexOf('const PRODUCTS = ')+17;const b=s.indexOf('// ── PRODUCT CATALOGUE: AUTO-GENERATED END ──');console.log('Deploying catalogue:',JSON.parse(s.slice(a,b).trim().replace(/;$/,'')).length,'products')"
          command: deploy --config wrangler-api.toml --keep-vars

      # A Cloudflare-side build is also wired to this repo and deploys
      # ysp-ai-proxy straight from the committed source, without running the
      # catalogue build. It finishes after this job, so it used to overwrite
      # the deploy above with a stale catalogue (observed 2026-09-03: correct
      # at 13:00:16, overwritten at 13:00:47). Committing the rebuilt file back
      # means both deployers ship the same thing, whichever one lands last.
      - name: Commit rebuilt catalogue
        run: |
          if git diff --quiet -- worker.js; then
            echo "Catalogue already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "Rebuild bot catalogue [skip ci]"
          git push

      - name: Sync stock from CMS to Worker
        env:
          YSP_AUTH_TOKEN: ${{ secrets.YSP_AUTH_TOKEN }}
        run: node scripts/seed-stock.js --token "$YSP_AUTH_TOKEN" --force
